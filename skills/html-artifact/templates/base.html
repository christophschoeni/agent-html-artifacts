<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { --bg:#f7f6f2; --ink:#1f2933; --muted:#65717c; --line:#d9d4ca; --panel:#fff; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.5; }
    header, main, footer { max-width:1120px; margin:0 auto; padding:28px 22px; }
    header { border-bottom:1px solid var(--line); }
    h1 { margin:0 0 10px; font-size:42px; letter-spacing:0; line-height:1.05; }
    h2 { margin:28px 0 12px; font-size:24px; letter-spacing:0; }
    h3 { margin:0 0 8px; font-size:17px; }
    .meta, .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
    .span-4 { grid-column:span 4; } .span-6 { grid-column:span 6; } .span-8 { grid-column:span 8; } .span-12 { grid-column:span 12; }
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; color:var(--muted); }
    .high { color:var(--bad); border-color:#fecaca; background:#fff1f2; }
    .medium { color:var(--warn); border-color:#fed7aa; background:#fff7ed; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    th, td { padding:11px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-size:13px; background:#fbfaf7; }
    tr:last-child td { border-bottom:0; }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 11px; font-weight:700; cursor:pointer; }
    pre { white-space:pre-wrap; overflow:auto; background:#14213d; color:#f8fafc; padding:14px; border-radius:8px; }
    @media (max-width:820px){ .span-4,.span-6,.span-8{grid-column:span 12} h1{font-size:34px} }
    @media print { button { display:none; } body { background:#fff; } .card, table { break-inside:avoid; } }
  </style>
</head>
<body>
  <header>
    <div class="meta">{{TYPE}} · {{DATE}} · {{SOURCE}}</div>
    <h1>{{TITLE}}</h1>
    <p>{{SUMMARY}}</p>
  </header>
  <main>{{CONTENT}}</main>
  <footer class="meta">Generated by html-artifact.</footer>
</body>
</html>
